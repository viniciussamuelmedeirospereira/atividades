<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
</head>
<body>
    <h1 id="titulogeral" class="titulogeral"> lista de inputs - HTML</h1>
    <br><br>

    <form action="">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" class="nome">

    <br><br>
    <label for="senha">senha:</label>
    <input type="password" id="senha" class="senha">

    <br><br>
    <label for="cpf">cpf</label>
    <input type="number" id="cpf" class="cpf">
    

    <br><br>
    <label for="email">email:</label>
    <input type="email" id="email" class="email">

    <br><br>
    <label for = "datanasc">data de nascimento</label>
    <input type="date" id="datanasc" class="datanas">

    <br><br>
    <label for = "cor">cor do Veículo</label>
    <input type="color" id="cor" class="cor">

    <br><br>
    <label for = "hora"> horario</label>
    <input type="time" id="hora" class="hora">

    <br><br>
    <label for = "dia da semana">dia da semana</label>
    <input type="week" id="week" class="dia da semana">

    <br><br>
    <input type="radio" id="masculino" name="sexo" class="masculino">
    <label for = "masculino">masculino</label>
    
   

    <br><br>
    <label for = "feminino">feminino</label>
    <input type="radio" id="feminino" name="sexo" class="feminino">

    <br><br>
    <label for = "analista">funçao</label>
    <input type="checkbox" id="gsti" name="funcao" class="gsti">

    <br><br>
    <label for = "gerente">gerente de tecnologia</label>
    <input type="checkbox" id="gsti" name="funcao" class="gsti">

    <br><br>
    <label for = "vol">volume</label>
    <input type="range" id="vol" name="volume">

    <br><br>
    <label for = "arquivo">Escolha de um arquivo - formato: .pdf, .png, .jpg</label>
    <input type="file" name = "arquivo" id="arquivo" class="arquivo">
    
    <br><br>
    <label for = "busca">buscar</label>
    <input type="search" id="busca" name="busca" class="busca">

    <br> <br>
    <label for = "url">endereço do site</label>
    <input type="url" id="url" name="url" class="url">

    <br><br>
    <label for = "contato">telefone</label>
    <input type="tel" id="contato" name="contato" class="contato">

    <br><br>
    <label for = "mensagem">mensagem</label>
    <textarea name="mensagem" id="mensagem" rows="5" cols="40"
              placeholder="Digite sua mensagem aqui..."></textarea>

    <br><br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar Dados">

    <br><br>
    
    <label for = "cidade">escolha sua cidade</label>
    <select name="cidade" id="cidade">
        <option value="" disabled selected>Selecione uma opção</option>
        <option value="sao paulo">São Paulo</option>
        <option value="rio de janeiro">Rio de Janeiro</option>
        <option value="belo horizonte">Belo Horizonte</option>
        <option value="curitiba">Curitiba</option>
        <option value="porto alegre">Porto Alegre</option>

    <br><br>
 </form>   
</body>
</html>
