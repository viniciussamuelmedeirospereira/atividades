<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Elaborado</title>

    <style>
    form {
    width: 700px;
    margin: 0 auto;
     }


    label {
    display: inline-block;
    width: 100px;
    margin-top: 20px;
    font-weight: normal;
    }


    input {
    height: 25px;
    margin: 5px;
    padding: 3px 8px;
    box-sizing: border-box;
    }


    input[type="text"] {
    width: 180px;
     }


    input[type="email"] {
    width: 380px;
    }


    input[type="tel"] {
    width: 115px;
    }


    textarea {
    width: 380px;
    height: 100px;
    margin: 5px;
    vertical-align: top;
    }


    select {
    width: 105px;
    height: 25px;
    margin: 5px;
    }


    input[type="submit"] {
    width: 105px;
    height: 35px;
    margin-top: 20px;
    }

    
    body{
    width: 700px;
    margin: 60px auto;
    padding: 40px;
    color: white;
    background-image: url("fundo.png");
    background-repeat: no-repeat;
	background-attachment: fixed;
	background-size: cover;

        }
    </style>
        



</head>

<body>

    <h1>Contact form</h1>
    
    <p>Please fill in your information an we'll be se</p>

    <form action="">
        
        <label for="name">Your Name</label>
        <input type="text" name="name" placeholder="First Name">
        <input type="text" name="last" placeholder="Last Name">

        <br>
        <label for="email">Your Email</label>
        <input type="email" class="email" id="email" placeholder="e.g.hello@contact.net">

        <br>
        <label for="contato">Phone</label>
        <input type="tel" name="contato" class="contato"placeholder="###">
        <input type="tel" name="contato" class="contato"placeholder="###">
        <input type="tel" name="contato" class="contato"placeholder="###">

        <br><br>
        <label for="ass">Message Subject*</label>
        <select name="ass">
        <option value="" disabled selected>Select Option</option>
        <option value="pr">Professional</option>
        <option value="pe">Person</option>         
        <option value="oy">Other</option>                    
        </select>

        <br><br>
        <label for="mensagem">Message*</label>
        <textarea name="mensagem" id="mensagem" rows="5" cols="40"></textarea>

        <br>
        <label for="Cap">Verificação:</label>
        <input type="checkbox" id="Cap" class="Cap" name="funcao">

        <br>
        <input type="submit" value="SUBMIT FORM">

    </form>
    
</body>

</html>
